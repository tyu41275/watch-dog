name: Deploy exact Watch Dog revision

run-name: Secret-safe live path diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed and merged GitHub commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: watch-dog-live-path-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate deployed revision and diagnostic ancestry
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          git merge-base --is-ancestor 52a43598e621c74cdb68cb6cf376396d6162d550 refs/remotes/origin/main
          git diff --quiet 52a43598e621c74cdb68cb6cf376396d6162d550 -- src public wrangler.jsonc package.json package-lock.json
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Diagnose live login and scan path without secret values
        env:
          DEPLOYED_URL: https://watch-dog.tytechnologiesconsulting.workers.dev/
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WATCH_DOG_JUDGE_USERNAME: ${{ secrets.WATCH_DOG_JUDGE_USERNAME }}
          WATCH_DOG_JUDGE_PASSWORD: ${{ secrets.WATCH_DOG_JUDGE_PASSWORD }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
        run: node scripts/diagnose-live-path.mjs
