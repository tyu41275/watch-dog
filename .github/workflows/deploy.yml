name: Deploy exact Watch Dog revision

run-name: Read-only Cloudflare diagnostic (sanitized)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed and merged GitHub commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: watch-dog-cloudflare-readonly-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact diagnostic branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate immutable product revision and diagnostic base
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "e3cd88c3c41dade06acc7d7f3c4a8a2f43513125"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "dd84a67545a6b1724408bdb6a9d5250f81ffe0da"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          git merge-base --is-ancestor refs/remotes/origin/main "$GITHUB_SHA"
          git diff --quiet "$EXPECTED_SHA" -- wrangler.jsonc
          test -z "$(git status --porcelain)"
      - name: Compare committed config with read-only Cloudflare metadata
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIAGNOSTIC_OUTPUT_PATH: ${{ runner.temp }}/cloudflare-readonly-diagnostic.json
          EXPECTED_PRODUCT_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-readonly-diagnostic.mjs
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-readonly-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-readonly-diagnostic.json
          if-no-files-found: error
          retention-days: 30
