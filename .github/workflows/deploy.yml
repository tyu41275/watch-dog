name: Deploy exact Watch Dog revision

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed and merged GitHub commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: watch-dog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate revision and merged ancestry
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Reproduce and gate the deployment
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:protocol
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run" \
            --var "BUILD_REVISION:$EXPECTED_SHA" \
            --var "GOOGLE_SAFE_BROWSING_ENABLED:true"
          test -z "$(git status --porcelain)"

      - name: Deploy Assets, Durable Object, bindings, and secrets
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.WATCH_DOG_JUDGE_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.WATCH_DOG_JUDGE_PASSWORD }}
          SESSION_SIGNING_KEY: ${{ secrets.WATCH_DOG_SESSION_SIGNING_SECRET }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ADMIN_USERNAME \
            ADMIN_PASSWORD SESSION_SIGNING_KEY GOOGLE_SAFE_BROWSING_API_KEY; do
            test -n "${!name:-}"
          done
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          trap 'rm -f -- "$deploy_log"' EXIT
          if ! npx wrangler deploy --strict \
            --message "GitHub $GITHUB_SHA" \
            --var "BUILD_REVISION:$GITHUB_SHA" \
            --var "GOOGLE_SAFE_BROWSING_ENABLED:true" \
            --secrets-file <(node --input-type=module -e '
              const names = ["ADMIN_USERNAME", "ADMIN_PASSWORD", "SESSION_SIGNING_KEY",
                "GOOGLE_SAFE_BROWSING_API_KEY"];
              const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]));
              if (Object.values(secrets).some((value) => typeof value !== "string" || value.length === 0))
                process.exit(2);
              process.stdout.write(JSON.stringify(secrets));
            ') >"$deploy_log" 2>&1; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const text = readFileSync(process.argv[1], "utf8").toLowerCase();
              const classes = ["authentication", "permission", "quota", "durable object",
                "workers.dev"].filter((value) => text.includes(value));
              console.error(`CLOUDFLARE_DEPLOY_FAIL:${classes.join(",") || "unclassified"}`);
            ' "$deploy_log"
            exit 1
          fi
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const text = readFileSync(process.argv[1], "utf8");
            const urls = [...text.matchAll(/https:\/\/[a-z0-9-]+(?:\.[a-z0-9-]+)*\.workers\.dev\/?/giu)];
            const ids = [...text.matchAll(/(?:version|deployment) id:\s*([a-z0-9-]{16,})/giu)];
            if (urls.length === 0 || ids.length === 0) process.exit(3);
            const url = new URL(urls.at(-1)[0]);
            const id = ids.at(-1)[1];
            const redacted = `${id.slice(0, 8)}…${id.slice(-4)}`;
            appendFileSync(process.env.GITHUB_OUTPUT,
              `url=${url.href}\ndeployment_id_redacted=${redacted}\n`);
          ' "$deploy_log"

      - name: Verify the exact live deployment
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID_REDACTED: ${{ steps.deploy.outputs.deployment_id_redacted }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WATCH_DOG_JUDGE_USERNAME: ${{ secrets.WATCH_DOG_JUDGE_USERNAME }}
          WATCH_DOG_JUDGE_PASSWORD: ${{ secrets.WATCH_DOG_JUDGE_PASSWORD }}
          WATCH_DOG_PROVIDER_CONSENT: "true"
          EVIDENCE_PATH: ${{ runner.temp }}/watch-dog-deployment-evidence.json
        run: node scripts/verify-deployment.mjs

      - name: Preserve sanitized deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watch-dog-deployment-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/watch-dog-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized job summary
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/watch-dog-deployment-evidence.json
        run: |
          {
            echo '## Exact deployment acceptance'
            echo '```json'
            cat "$EVIDENCE_PATH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
