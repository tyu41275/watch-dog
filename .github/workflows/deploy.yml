name: Deploy exact Watch Dog revision

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed and merged GitHub commit to deploy
        required: true
        type: string
      capture_demo:
        description: Record sanitized production Paste Scan and native WebMCP footage
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: watch-dog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate revision and merged ancestry
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Reproduce and gate deployment
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:protocol
          npm run typecheck
          npm test
          npm run build
          audit_ok=false
          for attempt in 1 2 3; do
            if npm_config_fetch_timeout=30000 npm audit --audit-level=high; then
              audit_ok=true
              break
            fi
            test "$attempt" -eq 3 || sleep "$((attempt * 10))"
          done
          test "$audit_ok" = true
          node scripts/verify-public-control.mjs
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run" --var "BUILD_REVISION:$EXPECTED_SHA" --var "GOOGLE_SAFE_BROWSING_ENABLED:true"
          test -z "$(git status --porcelain)"
      - name: Deploy exact gated bytes
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.WATCH_DOG_JUDGE_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.WATCH_DOG_JUDGE_PASSWORD }}
          SESSION_SIGNING_KEY: ${{ secrets.WATCH_DOG_SESSION_SIGNING_SECRET }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ADMIN_USERNAME ADMIN_PASSWORD SESSION_SIGNING_KEY GOOGLE_SAFE_BROWSING_API_KEY; do test -n "${!name:-}"; done
          log="$RUNNER_TEMP/deploy.log"; trap 'rm -f -- "$log"' EXIT
          npx wrangler deploy --strict --message "GitHub $GITHUB_SHA" --var "BUILD_REVISION:$GITHUB_SHA" --var "GOOGLE_SAFE_BROWSING_ENABLED:true" --secrets-file <(node --input-type=module -e 'const n=["ADMIN_USERNAME","ADMIN_PASSWORD","SESSION_SIGNING_KEY","GOOGLE_SAFE_BROWSING_API_KEY"];process.stdout.write(JSON.stringify(Object.fromEntries(n.map(k=>[k,process.env[k]]))))') >"$log" 2>&1 || { echo CLOUDFLARE_DEPLOY_FAIL; exit 1; }
          node --input-type=module -e 'import{appendFileSync,readFileSync}from"node:fs";const t=readFileSync(process.argv[1],"utf8"),u=[...t.matchAll(/https:\/\/[a-z0-9.-]+\.workers\.dev\/?/giu)].at(-1)?.[0],i=[...t.matchAll(/(?:version|deployment) id:\s*([a-z0-9-]{16,})/giu)].at(-1)?.[1];if(!u||!i)process.exit(3);appendFileSync(process.env.GITHUB_OUTPUT,`url=${new URL(u).href}\ndeployment_id_redacted=${i.slice(0,8)}…${i.slice(-4)}\n`)' "$log"
      - name: Verify exact live deployment
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID_REDACTED: ${{ steps.deploy.outputs.deployment_id_redacted }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WATCH_DOG_JUDGE_USERNAME: ${{ secrets.WATCH_DOG_JUDGE_USERNAME }}
          WATCH_DOG_JUDGE_PASSWORD: ${{ secrets.WATCH_DOG_JUDGE_PASSWORD }}
          WATCH_DOG_PROVIDER_CONSENT: "true"
          EVIDENCE_PATH: ${{ runner.temp }}/watch-dog-deployment-evidence.json
        run: node scripts/verify-deployment.mjs
      - name: Install supported Chromium for production capture
        if: ${{ always() && inputs.capture_demo && steps.deploy.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Capture authenticated production demo
        if: ${{ always() && inputs.capture_demo && steps.deploy.outcome == 'success' }}
        env:
          WATCH_DOG_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WATCH_DOG_JUDGE_USERNAME: ${{ secrets.WATCH_DOG_JUDGE_USERNAME }}
          WATCH_DOG_JUDGE_PASSWORD: ${{ secrets.WATCH_DOG_JUDGE_PASSWORD }}
          CAPTURE_OUTPUT: ${{ runner.temp }}/watch-dog-production-capture
        run: node scripts/capture-production-demo.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watch-dog-deployment-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/watch-dog-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && inputs.capture_demo && steps.deploy.outcome == 'success' }}
        with:
          name: watch-dog-production-capture-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/watch-dog-production-capture
          if-no-files-found: error
          retention-days: 30
